plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ROKID_RELEASE_KEYSTORE') ?:
        System.getProperty('user.home') + '/keys/rokid-wifi-on-release.jks'
def releaseStorePassword = System.getenv('ROKID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ROKID_KEY_PASSWORD')

android {
    namespace 'io.github.ksuzukigh.rokidwifion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ksuzukigh.rokidwifion'
        minSdk 26
        // Android 10以降でもWifiManagerによるオン操作を試せる互換対象。
        // GitHub配布のRV101専用アプリとして使用する。
        targetSdk 28
        versionCode 5
        versionName '0.5'
    }

    signingConfigs {
        release {
            storeFile file(releaseKeystorePath)
            storePassword releaseStorePassword
            keyAlias 'rokid'
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // This RV101-only app is sideloaded and intentionally targets the legacy
        // WifiManager compatibility behavior; it is not distributed via Google Play.
        disable 'ExpiredTargetSdkVersion'
        // The installer grants this development permission explicitly over ADB.
        // It is verified on the RV101 before the app is used.
        disable 'ProtectedPermissions'
    }
}
